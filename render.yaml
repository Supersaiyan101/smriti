services:
  # -------------------------------------------------------------
  # Backend API Service (Express + Mastra + Sentry + MongoDB)
  # -------------------------------------------------------------
  - type: web
    name: smriti-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: smriti
      - key: GEMMA_API_BASE
        value: http://localhost:11434
      - key: GEMMA_MODEL
        value: gemma2:9b
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: JBFqnCBsd6RMkjVDRZzb
      - key: SENTRY_DSN
        sync: false

  # -------------------------------------------------------------
  # Frontend Static Web App (React + Vite)
  # -------------------------------------------------------------
  - type: web
    name: smriti-sanctuary
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Proxy API requests to the backend service
      - type: rewrite
        source: /api/*
        destination: https://smriti-api-otpb.onrender.com/api/*
      - type: rewrite
        source: /uploads/*
        destination: https://smriti-api-otpb.onrender.com/uploads/*
      # Single-Page Application (SPA) catch-all
      - type: rewrite
        source: /*
        destination: /index.html
